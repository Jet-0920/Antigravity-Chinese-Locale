<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 渐变光环 -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- 核心球体渐变 -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- 文字金色渐变 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- 辉光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 阴影底衬 -->
  <circle cx="64" cy="64" r="54" fill="url(#coreGrad)" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- 外围轨道反重力环 1 -->
  <ellipse cx="64" cy="64" rx="58" ry="24" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="80 30" transform="rotate(-30 64 64)" filter="url(#glow)" />
  
  <!-- 外围轨道反重力环 2 -->
  <ellipse cx="64" cy="64" rx="58" ry="24" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="40 20" transform="rotate(45 64 64)" opacity="0.8" />

  <!-- 卫星粒子 -->
  <circle cx="20" cy="40" r="3" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="108" cy="88" r="2.5" fill="#8B5CF6" filter="url(#glow)" />
  <circle cx="95" cy="30" r="2" fill="#10B981" filter="url(#glow)" />

  <!-- 中心汉化代表符号："汉" 艺术化剪影 / 引力浮空矢量 -->
  <g transform="translate(64, 64) scale(0.95)" text-anchor="middle" dominant-baseline="central">
    <text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="44" fill="url(#textGrad)" y="2">汉</text>
  </g>

  <!-- 内部发光点缀 -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#60A5FA" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.4" />
</svg>
