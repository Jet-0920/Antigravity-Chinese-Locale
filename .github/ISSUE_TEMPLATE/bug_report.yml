name: "漏译反馈 / 界面还是英文 (Bug Report)"
description: "发现某处界面仍显示英文或翻译不准确？在此提交反馈（支持直接粘贴截图）"
title: "[漏译反馈]: "
labels: ["bug", "i18n-missing"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你协助完善 Antigravity 中文汉化！
        提示：你也可以直接把没汉化的界面截屏发给对话框里的智能体，说一句“这个地方帮我汉化一下”，它就会自动帮你补全并更新！
  - type: input
    id: location
    attributes:
      label: "未汉化位置 / 路径"
      description: "例如：设置 -> 常规设置 -> 网络访问权限，或扩展市场详情页"
      placeholder: "设置 -> 常规设置"
    validations:
      required: true
  - type: textarea
    id: english_text
    attributes:
      label: "未汉化的英文原文"
      description: "请提供界面上显示的英文原文（若有多处可逐行填写）"
      placeholder: "This subagent was killed and can no longer be messaged."
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: "问题截图 (强烈推荐)"
      description: "直接 Ctrl+V 粘贴截图，有图有真相处理速度最快"
      placeholder: "在此粘贴截图..."
    validations:
      required: false
  - type: input
    id: suggested_translation
    attributes:
      label: "您建议的中文翻译 (选填)"
      placeholder: "该子智能体已被终止，无法再发送消息。"
    validations:
      required: false
